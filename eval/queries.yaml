# Public golden retrieval set, over the synthetic corpus in eval/corpus/.
#
# `relevant` lists "<project>/<source>" paths rather than entry ids, because ids
# are regenerated on every re-ingest while paths are stable.
#
# Build the database and run it:
#   python -m knowledge_store.ingest eval/corpus --db eval/fixtures/synthetic.db
#   python eval/run_eval.py
#
# The corpus is synthetic but deliberately awkward: projects share vocabulary
# (Postgres, Redis, rate limits, caching), one planning document is duplicated
# across two projects, and several documents discuss the same subsystem from
# different angles. A corpus of unrelated documents makes every query trivially
# rank-1 and measures nothing.

- query: how do we replay carrier webhooks after an outage
  project: freight-router
  relevant: [freight-router/docs/webhook-replay-runbook.md]

