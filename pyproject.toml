[project]
name = "knowledge-store"
version = "0.1.0"
description = "Cross-project knowledge store over MCP: provenance-tagged, supersession-aware."
requires-python = ">=3.10"
dependencies = ["mcp>=2.2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "PyYAML>=6.0"]

[project.scripts]
knowledge-store = "knowledge_store.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["knowledge_store"]

[tool.pytest.ini_options]
testpaths = ["tests"]
